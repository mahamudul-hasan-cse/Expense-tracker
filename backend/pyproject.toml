[project]
name = "expense-tracker-backend"
version = "0.1.0"
description = "Expense Tracker API Backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.109.0",
    "uvicorn[standard]==0.27.0",
    "sqlalchemy==2.0.25",
    "psycopg2-binary==2.9.9",
    "alembic==1.13.1",
    "pydantic==2.5.3",
    "pydantic-settings==2.1.0",
    "python-dotenv==1.0.0",
    "argon2-cffi>=23.1",
    "pyjwt>=2.8",
    "email-validator>=2.1",
    "slowapi>=0.1.9",
    "tzdata>=2024.1",
]

[dependency-groups]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "httpx>=0.25,<0.28",
    "pytest-cov>=5",
    "ruff>=0.6",
    "mypy>=1.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=app --cov-report=term-missing:skip-covered --cov-fail-under=80"

[tool.coverage.run]
source = ["app"]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
# pycodestyle, pyflakes, import sorting, bugbear
select = ["E", "F", "W", "I", "B"]
ignore = [
    "E501",  # long lines: the formatter handles wrapping; long test/SQL lines are fine
    "B008",  # FastAPI's Depends()/Query() in argument defaults is the intended pattern
]

[tool.ruff.lint.isort]
# The local alembic/ folder would otherwise make ruff treat the package as first-party
known-third-party = ["alembic"]

[tool.ruff.lint.per-file-ignores]
"tests/conftest.py" = ["E402"]  # env vars must be set before importing the app

[tool.ruff.format]
quote-style = "preserve"

[tool.mypy]
python_version = "3.11"
packages = ["app"]
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
check_untyped_defs = true
