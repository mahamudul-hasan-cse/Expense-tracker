[project]
name = "expense-tracker-backend"
version = "0.1.0"
description = "Expense Tracker API Backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.162.0",
    "starlette>=1.3.1",  # security fixes (Host/path validation, form parsing limits)
    "uvicorn[standard]==0.54.0",
    "sqlalchemy==2.1.6",
    "alembic==1.20.1",
    "pydantic==2.14.1",
    "pydantic-settings==2.1.0",
    "python-dotenv==1.2.4",
    "argon2-cffi>=23.1",
    "pyjwt>=2.8",
    "email-validator>=2.1",
    "slowapi>=0.1.9",
    "tzdata>=2024.1",
    "openai>=1.50",
    "psycopg[binary]==3.3.6",
    "sentry-sdk[fastapi]>=2.40",
]

[dependency-groups]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "httpx>=0.27",
    "pytest-cov>=5",
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest-github-actions-annotate-failures>=0.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=app --cov-report=term-missing:skip-covered --cov-fail-under=80"

[tool.coverage.run]
source = ["app"]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
# pycodestyle, pyflakes, import sorting, bugbear, and DTZ: no timezone-naive
# date.today()/datetime.now(). "Today" is Asia/Dhaka (app.timeutil.today()); the
# server's own clock gave the wrong date between 18:00 and 24:00 UTC (CI caught it).
select = ["E", "F", "W", "I", "B", "DTZ"]
ignore = [
    "E501",  # long lines: the formatter handles wrapping; long test/SQL lines are fine
    "B008",  # FastAPI's Depends()/Query() in argument defaults is the intended pattern
]

[tool.ruff.lint.isort]
# The local alembic/ folder would otherwise make ruff treat the package as first-party
known-third-party = ["alembic"]

[tool.ruff.lint.per-file-ignores]
"tests/conftest.py" = ["E402"]  # env vars must be set before importing the app

[tool.ruff.format]
quote-style = "preserve"

[tool.mypy]
python_version = "3.11"
packages = ["app"]
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
check_untyped_defs = true
