version: 2
updates:
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # One PR for all minor/patch updates; majors arrive as separate PRs to review
      npm-minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Deliberately deferred (see docs/PRODUCTION_PLAN.md, "Optional later cleanups")
      - dependency-name: tailwindcss
        update-types: ["version-update:semver-major"]
      - dependency-name: lucide-react
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      # Next/React majors are planned upgrades, not routine bumps
      - dependency-name: next
        update-types: ["version-update:semver-major"]
      - dependency-name: eslint-config-next
        update-types: ["version-update:semver-major"]

  - package-ecosystem: uv
    directory: /backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      python-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
